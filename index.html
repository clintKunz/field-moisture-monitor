<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Field Moisture Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>Field Moisture Monitor</h1>
        <span class="farm">Snake River Plain demo farm · simulated sensors</span>
        <span class="clock" id="clock">–</span>
        <button id="play" type="button">Pause</button>
      </header>

      <main class="map" id="map" aria-label="Farm map with soil moisture sensors"></main>

      <aside class="panel">
        <section>
          <h2>Soil moisture</h2>
          <div class="legend" id="legend"></div>
        </section>
        <section>
          <h2>Fields</h2>
          <table class="fields">
            <thead><tr><th>Field</th><th class="num">Avg</th><th class="num">Dry</th><th class="num">Wet</th></tr></thead>
            <tbody id="field-rows"></tbody>
          </table>
        </section>
        <section>
          <h2>Selected sensor</h2>
          <p id="selected" class="muted">Click a sensor on the map.</p>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
